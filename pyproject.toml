[project]
name = "pyrails-mvc"
version = "0.1.0"
description = "Convention over configuration MVC framework for FastAPI with Rails-inspired CLI"
authors = [
    {name = "Carson Mulligan", email = "carson@carsonmulligan.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["fastapi", "rails", "mvc", "framework", "sqlalchemy", "async", "web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "sqladmin>=0.19.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.5.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "rich>=13.0.0",
    "click>=8.1.0",
    "inflect>=7.0.0",
]

[project.optional-dependencies]
postgresql = ["asyncpg>=0.29.0"]
mysql = ["aiomysql>=0.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "ipython>=8.12.0",
]

[project.scripts]
pyrails = "pyrails.cli:main"

[project.urls]
Homepage = "https://github.com/carsonmulligan/pyrails"
Repository = "https://github.com/carsonmulligan/pyrails"
Issues = "https://github.com/carsonmulligan/pyrails/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyrails"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
